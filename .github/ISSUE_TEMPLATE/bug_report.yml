name: Bug report
description: Something doesn't work the way it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: dropdown
    id: tool
    attributes:
      label: Which tool?
      options: [Autoclicker, Key Repeater, Macros, Settings / hotkeys, Other]
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Input mode
      options: [Foreground (cursor / active window), Background window, Not sure]
  - type: input
    id: target
    attributes:
      label: Target app (for background mode)
      placeholder: e.g. Notepad, Chrome, a specific game
  - type: input
    id: os
    attributes:
      label: OS and version
      placeholder: e.g. Windows 11 24H2, Ubuntu 24.04 (X11)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: IDB-Macro version
      description: Shown in Settings → About.
    validations:
      required: true
